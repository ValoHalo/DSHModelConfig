name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - name: Check scripts and manifests
        run: |
          node --check scripts/prepare-harness.mjs
          node --check scripts/build-packages.mjs
          node --check scripts/package-plugin-kits.mjs
          node -e "for (const file of ['package.json', 'plugin-project.json', 'upstream/harness.json']) JSON.parse(require('node:fs').readFileSync(file, 'utf8'))"
          bash -n install.sh scripts/package-release.sh scripts/plugin-kit-templates/install.sh
      - name: Check pinned Harness patches
        run: node scripts/prepare-harness.mjs
