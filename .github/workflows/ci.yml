name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - name: Check scripts and manifests
        run: |
          node --check scripts/prepare-harness.mjs
          node --check scripts/build-packages.mjs
          node --check scripts/generate-model-capacity-defaults.mjs
          node --check scripts/package-plugin-kits.mjs
          node -e "for (const file of ['package.json', 'packages/model-config/package.json', 'plugin-project.json', 'upstream/harness.json']) JSON.parse(require('node:fs').readFileSync(file, 'utf8'))"
          bash -n install.sh scripts/package-release.sh scripts/plugin-kit-templates/install.sh
      - name: Build and test release artifacts
        run: bash scripts/package-release.sh
      - name: Verify npm package contents
        shell: bash
        run: |
          tarball=$(find .build/tarballs -maxdepth 1 -type f -name '*.tgz' -print -quit)
          [[ -n "$tarball" ]] || { echo "npm tarball was not created" >&2; exit 1; }
          mapfile -t entries < <(tar -tzf "$tarball")
          printf '%s\n' "${entries[@]}" | grep -Fxq 'package/THIRD_PARTY_NOTICES.md'
          if printf '%s\n' "${entries[@]}" | grep -q '^package/src/'; then
            echo "npm tarball unexpectedly contains package/src" >&2
            exit 1
          fi
      - name: Read package version
        id: package
        shell: bash
        run: |
          version=$(node -p "require('./packages/model-config/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Model-Extensions-${{ steps.package.outputs.version }}
          path: |
            .build/tarballs/*.tgz
            release/*.zip
          if-no-files-found: error
          retention-days: 7
